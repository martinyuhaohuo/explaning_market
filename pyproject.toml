[project]
name = "explaining-markets-modal-starter"
version = "0.1.0b1"
description = "A minimal Modal starter for the Explaining Markets competition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "modal>=0.64",
    "fastapi>=0.110",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.6",
    # Needed locally so `modal deploy` can read .env via Secret.from_dotenv.
    "python-dotenv>=1.0",
    "langgraph>=1.2.14",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langchain-google-genai>=4.4.1",
    "langchain-anthropic>=1.7.5",
    "langfuse>=4.17.0",
    "pandas>=2.3.3",
    "yfinance>=1.7.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.9",
    "pytest>=8.3",
]

# Mirror of the dev group for pip users (`pip install -e ".[dev]"`) — plain pip
# doesn't read [dependency-groups]. Keep the two lists in sync.
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is importable via the editable install (which points at src/).
# "." restores only the repo-root entry that the top-level entry scripts
# (predict.py, modal_app.py) need — it does not re-expose the package from root.
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/explaining_markets",
    "src/em_agent",
    "src/suprise_dim",
    "src/ml",
]
